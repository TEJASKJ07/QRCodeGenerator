<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom QR Code Generator</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/mDmLbxnd/qrcode.png">
  <!-- QRious Library (Canvas Native) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { 
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px; 
    }
    .card { 
      background: rgba(30, 41, 59, 0.85); 
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px; 
      border-radius: 16px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.1); 
      width: 100%; 
      max-width: 440px; 
    }
    h2 { 
      margin-top: 0; 
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center; 
      margin-bottom: 24px; 
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .group { margin-bottom: 18px; }
    label { 
      display: block; 
      font-weight: 600; 
      font-size: 13px; 
      margin-bottom: 8px; 
      color: #94a3b8; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"] { 
      width: 100%; 
      padding: 12px 14px; 
      background: #0f172a;
      border: 1px solid #334155; 
      border-radius: 8px; 
      font-size: 14px; 
      color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    input[type="file"] { 
      width: 100%; 
      padding: 10px; 
      background: #0f172a;
      border: 1px solid #334155; 
      border-radius: 8px; 
      font-size: 13px; 
      color: #94a3b8;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: #334155;
      border: none;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
      background: #475569;
    }
    .colors { display: flex; gap: 14px; }
    .color-field { flex: 1; }
    .color-picker-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 4px;
      border-radius: 8px;
    }
    input[type="color"] { 
      width: 38px; 
      height: 38px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      background: transparent; 
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    .hex-input { 
      border: none !important; 
      background: transparent !important;
      padding: 0 6px !important;
      text-transform: uppercase; 
      font-family: monospace; 
      font-size: 13px !important;
    }
    .hex-input:focus { box-shadow: none !important; }
    .preview-area { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin: 24px 0; 
      min-height: 240px; 
      background: #0f172a; 
      border: 1px dashed #334155; 
      border-radius: 12px; 
      padding: 16px; 
    }
    #canvas { 
      border-radius: 8px; 
      max-width: 100%; 
      height: auto; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    button { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    button:hover { 
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>QR Code Generator</h2>

  <div class="group">
    <label for="url">Website URL</label>
    <input type="text" id="url" placeholder="https://example.com" value="https://example.com">
  </div>

  <div class="group colors">
    <div class="color-field">
      <label>QR Dots Color</label>
      <div class="color-picker-wrapper">
        <input type="color" id="dotColor" value="#000000">
        <input type="text" id="dotHex" class="hex-input" value="#000000" placeholder="#000000" maxlength="7">
      </div>
    </div>
    <div class="color-field">
      <label>Background Color</label>
      <div class="color-picker-wrapper">
        <input type="color" id="bgColor" value="#ffffff">
        <input type="text" id="bgHex" class="hex-input" value="#FFFFFF" placeholder="#FFFFFF" maxlength="7">
      </div>
    </div>
  </div>

  <div class="group">
    <label for="logo">Center Logo (Optional PNG)</label>
    <input type="file" id="logo" accept="image/png, image/jpeg">
  </div>

  <div class="preview-area">
    <canvas id="canvas" width="260" height="260"></canvas>
  </div>

  <button id="downloadBtn">Download PNG</button>
</div>

<script>
  const urlInput = document.getElementById('url');
  const dotColorInput = document.getElementById('dotColor');
  const dotHexInput = document.getElementById('dotHex');
  const bgColorInput = document.getElementById('bgColor');
  const bgHexInput = document.getElementById('bgHex');
  const logoInput = document.getElementById('logo');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');

  let logoImage = null;

  const qr = new QRious({
    element: canvas,
    size: 260,
    level: 'H'
  });

  function updateQR() {
    let url = urlInput.value.trim() || 'https://example.com';
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    qr.set({
      value: url,
      foreground: dotColorInput.value,
      background: bgColorInput.value
    });

    if (logoImage) {
      const logoSize = canvas.width * 0.28;
      const x = (canvas.width - logoSize) / 2;
      const y = (canvas.height - logoSize) / 2;

      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(logoImage, x, y, logoSize, logoSize);
    }
  }

  function isValidHex(hex) {
    return /^#([0-9A-F]{3}){1,2}$/i.test(hex);
  }

  dotColorInput.addEventListener('input', () => {
    dotHexInput.value = dotColorInput.value.toUpperCase();
    updateQR();
  });

  bgColorInput.addEventListener('input', () => {
    bgHexInput.value = bgColorInput.value.toUpperCase();
    updateQR();
  });

  dotHexInput.addEventListener('input', () => {
    let hex = dotHexInput.value.trim();
    if (hex && !hex.startsWith('#')) hex = '#' + hex;
    
    if (isValidHex(hex)) {
      dotColorInput.value = hex;
      updateQR();
    }
  });

  bgHexInput.addEventListener('input', () => {
    let hex = bgHexInput.value.trim();
    if (hex && !hex.startsWith('#')) hex = '#' + hex;

    if (isValidHex(hex)) {
      bgColorInput.value = hex;
      updateQR();
    }
  });

  logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        logoImage = new Image();
        logoImage.onload = updateQR;
        logoImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      logoImage = null;
      updateQR();
    }
  });

  downloadBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return;
      
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = 'qrcode.png';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
      }, 1000);
    }, 'image/png');
  });

  urlInput.addEventListener('input', updateQR);

  updateQR();
</script>

</body>
</html>
